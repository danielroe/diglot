minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@x18n/builtins@0.1.10'
  - '@x18n/core@0.1.10'
  - '@x18n/node@0.1.10'
  - '@nuxt/kit@4.6.4'
  - '@nuxt/nitro-server@4.6.4'
  - '@nuxt/schema@4.6.4'
  - '@nuxt/vite-builder@4.6.4'
  - '@nuxt/vite-server@4.6.4'
  - nitropack@2.13.6
  - nuxt@4.6.4
  - semver@6.3.2
  - unrouting@0.3.2

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - docs
  - examples/angular
  - examples/astro
  - packages/*

overrides:
  # Astro's Markdown renderer pins Sätteri 0.10, and its `svgo` pins older CSS and DOM packages. Those versions are
  # published with weaker provenance than the ones this repository already uses, which fails the provenance check.
  '@astrojs/markdown-satteri>satteri': 0.11.6
  csso>css-tree: ^3.2.1
  # Newer versions overflow the stack in `remark-mdc`, which breaks `llms-full.txt`: https://github.com/nuxt-content/remark-mdc/issues/161
  mdast-util-to-markdown: 2.1.2
  # For the provenance check, like the overrides above.
  svgo>css-select: ^7.0.0

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  simple-git-hooks: true
  vue-demi: false
