minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@x18n/builtins@0.1.10'
  - '@x18n/core@0.1.10'
  - '@x18n/node@0.1.10'
  - '@nuxt/kit@4.6.4'
  - '@nuxt/nitro-server@4.6.4'
  - '@nuxt/schema@4.6.4'
  - '@nuxt/vite-builder@4.6.4'
  - '@nuxt/vite-server@4.6.4'
  - nitropack@2.13.6
  - nuxt@4.6.4
  - semver@6.3.2
  - unrouting@0.3.2

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - docs
  - examples/astro
  - packages/*

overrides:
  # Astro's Markdown renderer and Starlight pin Sätteri 0.10, Astro's `svgo` pins older CSS and DOM packages, and
  # Starlight's sitemap older Node types. Those versions are published with weaker provenance than the ones this
  # repository already uses, which fails the provenance check.
  '@astrojs/markdown-satteri>satteri': 0.11.7
  '@astrojs/starlight>satteri': 0.11.7
  '@types/sax>@types/node': 26.6.6
  csso>css-tree: ^3.2.1
  # Newer versions overflow the stack in `remark-mdc`, which breaks `llms-full.txt`: https://github.com/nuxt-content/remark-mdc/issues/161
  mdast-util-to-markdown: 2.2.3
  # For the provenance check, like the overrides above.
  sitemap>@types/node: 26.6.6
  svgo>css-select: ^7.0.0

allowBuilds:
  better-sqlite3: false
  esbuild: false
  simple-git-hooks: true
  vue-demi: false
